<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>晨報 MORNING BRIEF</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="broadsheet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="brief" id="brief">
    <div class="ink-bars">
      <span class="ink-bar" style="background:#0088b0"></span>
      <span class="ink-bar" style="background:#d6006c"></span>
      <span class="ink-bar" style="background:#edbb00"></span>
      <span class="ink-bar" style="background:#201e1d"></span>
    </div>

    <header class="masthead">
      <span class="masthead-title">晨　報</span>
      <span class="masthead-en">MORNING BRIEF</span>
    </header>

    <div class="dateline">
      <span id="dateline-date">----年--月--日</span>
      <span id="dateline-weather" class="dateline-weather" hidden>
        <span class="dateline-dot"></span><span id="dateline-weather-text"></span>
      </span>
      <span id="dateline-issue" class="dateline-issue" hidden></span>
    </div>

    <p class="greeting" id="greeting"></p>
    <p class="greeting-sub" id="greeting-sub" hidden></p>

    <section class="section" id="section-schedule" hidden>
      <div class="eyebrow eyebrow-cyan"><span class="eyebrow-dot" style="background:#0088b0"></span>今日行程　SCHEDULE</div>
      <div id="schedule-list"></div>
      <p class="section-note" id="schedule-note" hidden></p>
    </section>

    <section class="section" id="section-todo-today" hidden>
      <div class="eyebrow eyebrow-magenta"><span class="eyebrow-dot" style="background:#d6006c"></span>今日待辦　TO DO</div>
      <div id="todo-today-list" class="todo-list"></div>
    </section>

    <section class="section" id="section-todo-longterm" hidden>
      <div class="eyebrow eyebrow-magenta"><span class="eyebrow-dot" style="background:#d6006c"></span>長期待辦　ONGOING</div>
      <div id="todo-longterm-list" class="todo-list"></div>
    </section>

    <section class="section" id="section-inbox" hidden>
      <div class="eyebrow eyebrow-cyan"><span class="eyebrow-dot" style="background:#0088b0"></span>還沒回的訊息　UNANSWERED</div>
      <div id="inbox-list"></div>
    </section>

    <section class="section" id="section-reading" hidden>
      <div class="eyebrow eyebrow-magenta"><span class="eyebrow-dot" style="background:#d6006c"></span>今天值得看的　READING</div>
      <div id="reading-list"></div>
    </section>

    <section class="section" id="section-stats" hidden>
      <div class="eyebrow eyebrow-cyan"><span class="eyebrow-dot" style="background:#edbb00"></span>昨天的你　YESTERDAY</div>
      <div class="stats-row" id="stats-row"></div>
      <div id="stats-note"></div>
    </section>

    <section class="closing-block" id="section-closing" hidden>
      <div class="eyebrow eyebrow-magenta"><span class="eyebrow-dot" style="background:#d6006c"></span>今天的一句話</div>
      <p class="closing-text" id="closing-text"></p>
    </section>

    <footer class="brief-footer">
      <nav class="footer-nav">
        <button type="button" class="footer-nav-btn" id="nav-prev">← 前一天</button>
        <span class="footer-nav-sep">·</span>
        <button type="button" class="footer-nav-btn" id="nav-latest">回到今天</button>
        <span class="footer-nav-sep">·</span>
        <button type="button" class="footer-nav-btn" id="nav-next">後一天 →</button>
        <select class="footer-nav-select" id="nav-history"></select>
      </nav>
      <span class="footer-source">來源：Discord · Hacker News · Google 新聞 · YouTube</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
