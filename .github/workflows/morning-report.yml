name: Morning Report

on:
  schedule:
    # 22:30 UTC = 06:30 台北時間，需要調整時間就改這裡
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: TEMP debug - list available Groq models
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: curl -s -H "Authorization: Bearer $GROQ_API_KEY" https://api.groq.com/openai/v1/models | python3 -c "import json,sys; data=json.load(sys.stdin); print('\n'.join(m['id'] for m in data.get('data', [])))"

      - name: Generate report and send Discord push
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CALENDAR_CHANNEL_ID: ${{ secrets.DISCORD_CALENDAR_CHANNEL_ID }}
          DISCORD_INTERESTING_LINKS_CHANNEL_ID: ${{ secrets.DISCORD_INTERESTING_LINKS_CHANNEL_ID }}
          # 看板網址／推播頻道 ID 都不是敏感資訊，預設值寫死在 config.py 裡；不特別在這裡注入，
          # 避免 GitHub Actions 對「未設定的 secret／variable」注入空字串蓋掉 config.py 的預設值
          # （PAGES_BASE_URL 曾經叫 GITHUB_PAGES_URL，但 Actions 不允許自訂變數用 GITHUB_ 開頭，
          # 導致 vars.GITHUB_PAGES_URL 從來沒有真的生效過，推播出去的連結其實是壞的，已修正）
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          EVENTBRITE_API_TOKEN: ${{ secrets.EVENTBRITE_API_TOKEN }}
        run: python -m morning_report.generate_report

      - name: Commit updated memory & board data
        run: |
          git config user.name "morning-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add memory/habits.md memory/interests.md morning_report/state/habit_state.json morning_report/state/interests_state.json docs/data
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: update morning report data [skip ci]"
          git push
