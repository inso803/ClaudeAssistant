name: Morning Report

on:
  schedule:
    # 22:30 UTC = 06:30 台北時間，需要調整時間就改這裡
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-and-send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate report and send LINE push
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_PAGES_URL: ${{ vars.GITHUB_PAGES_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CALENDAR_CHANNEL_ID: ${{ secrets.DISCORD_CALENDAR_CHANNEL_ID }}
          DISCORD_INTERESTING_LINKS_CHANNEL_ID: ${{ secrets.DISCORD_INTERESTING_LINKS_CHANNEL_ID }}
        run: python -m morning_report.generate_report

      - name: Commit updated memory & board data
        run: |
          git config user.name "morning-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add memory/habits.md morning_report/state/habit_state.json docs/data/latest.json
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: update morning report data [skip ci]"
          git push
