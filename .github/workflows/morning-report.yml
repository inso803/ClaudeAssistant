name: Morning Report

# 兩段接力流程的第一段：只做資料蒐集（Discord 今日/長期待辦、收藏連結、多來源推薦搜尋），
# 不呼叫任何 LLM，寫成 pending_request.json 交給排程的 Claude Code routine 寫內容。
# 第二段（routine 寫內容 -> apply_content.py）跟第三段（推 Discord 連結）都不在這支 workflow 裡，
# 詳見 morning_report/collect_report_request.py 開頭的說明。

on:
  schedule:
    # 22:30 UTC = 06:30 台北時間，需要調整時間就改這裡
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect todos/links and write pending_request.json
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CALENDAR_CHANNEL_ID: ${{ secrets.DISCORD_CALENDAR_CHANNEL_ID }}
          DISCORD_LONGTERM_TODO_CHANNEL_ID: ${{ secrets.DISCORD_LONGTERM_TODO_CHANNEL_ID }}
          DISCORD_INTERESTING_LINKS_CHANNEL_ID: ${{ secrets.DISCORD_INTERESTING_LINKS_CHANNEL_ID }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          EVENTBRITE_API_TOKEN: ${{ secrets.EVENTBRITE_API_TOKEN }}
        run: python -m morning_report.collect_report_request

      - name: Commit interests state + pending_request.json
        run: |
          git config user.name "morning-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add memory/interests.md morning_report/state/interests_state.json morning_report/state/pending_request.json
          git diff --cached --quiet && echo "no changes" || git commit -m "chore: collect morning report request data"
          git push
